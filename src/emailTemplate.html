<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Test Email from Nodemailer</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
                background-color: #f4f4f4;
            }
            .container {
                width: 100%;
                max-width: 600px;
                margin: 0 auto;
                background-color: #ffffff;
                border-radius: 8px;
                padding: 20px;
                box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            }
            .header {
                text-align: center;
                margin-bottom: 20px;
            }
            .header h1 {
                color: #3498db;
                font-size: 28px;
            }
            .content {
                font-size: 16px;
                color: #333;
                line-height: 1.6;
            }
            .footer {
                text-align: center;
                font-size: 14px;
                color: #777;
                margin-top: 20px;
            }
            .button {
                background-color: #3498db;
                color: #ffffff;
                padding: 10px 20px;
                text-decoration: none;
                border-radius: 5px;
                font-weight: bold;
            }
            .button:hover {
                background-color: #2980b9;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="header">
                <h1>Welcome to My App!</h1>
            </div>
            <div class="content">
                <p>Hello!</p>
                <p>This is an HTML email sent through Nodemailer.</p>
                <p>We hope you're having a great day!</p>
                <p><a href="https://github.com/gustasvos/nodemailer-test" class="button">Visit Our Website</a></p>
            </div>
            <div class="footer">
                <p>&copy; 2025 My App. All rights reserved.</p>
            </div>
        </div>
    </body>
</html>
